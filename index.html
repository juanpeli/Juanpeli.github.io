<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visualizador de Videos</title>

<style>

body {
    background-color: #000;
    color: white;
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}


h1 {
    color: red;
    text-align: center;
    text-transform: uppercase;
}


#pantalla-bloqueo {
    position: fixed;
    inset: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}


.modal-bloqueo {
    background: #111;
    padding: 40px;
    border: 2px solid red;
    border-radius: 10px;
    text-align: center;
}


.modal-bloqueo input {
    padding: 12px;
    font-size: 18px;
    width: 80%;
    background: black;
    color: white;
    border: 1px solid red;
    text-align: center;
}


button {
    margin-top: 20px;
    background: red;
    color:white;
    border:none;
    padding:12px 25px;
    cursor:pointer;
    border-radius:5px;
    font-weight:bold;
}


#mensaje-error {
    color:red;
    display:none;
}


#contenido-principal {
    display:none;
    flex-direction:column;
    align-items:center;
    width:100%;
}


.video-container {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
    width:100%;
}


.video-box {
    width:380px;
    background:#111;
    border:2px solid red;
    border-radius:10px;
    overflow:hidden;
}


iframe {
    width:100%;
    height:250px;
    display:block;
}


.video-label {
    padding:15px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}


</style>

</head>


<body>


<div id="pantalla-bloqueo">

<div class="modal-bloqueo">

<h2>Acceso Protegido</h2>

<input type="password" id="input-pass" placeholder="Ingresa el PIN">

<br>

<button onclick="verificarContrasena()">
Entrar
</button>


<p id="mensaje-error">
PIN incorrecto
</p>


</div>

</div>




<div id="contenido-principal">


<h1>
THE SIMPSon
</h1>



<div class="video-container">



<div class="video-box">

<IFRAME SRC="https://fastream.to/embed-ahpw7zcwv1oc.html" FRAMEBORDER=0 MARGINWIDTH=0 
MARGINHEIGHT=0 SCROLLING=NO WIDTH=640 HEIGHT=360 allowfullscreen></IFRAME>

<div class="video-label">
LOS SIMPSON LA PELICULA
</div>

</div>

 MARGINHEIGHT=0 SCROLLING=NO WIDTH=640 HEIGHT=360 allowfullscreen></IFRAME>
<div class="video-label">

</div>

<div class="video-label">

</div>






<div class="video-box">

<IFRAME SRC="https://fastream.to/embed-qs8w0zuodjub.html" FRAMEBORDER=0 MARGINWIDTH=0 
MARGINHEIGHT=0 SCROLLING=NO WIDTH=640 HEIGHT=360 allowfullscreen></IFRAME>

<div class="video-label">
Battleship

<div class="video-label">
Troll
</div>

</div>

</div>



<script>


function verificarContrasena(){

let input = document.getElementById("input-pass").value;


if(input === "4455"){

document.getElementById("pantalla-bloqueo").style.display="none";

document.getElementById("contenido-principal").style.display="flex";


}else{


document.getElementById("mensaje-error").style.display="block";

document.getElementById("input-pass").value="";


}


}



document.getElementById("input-pass")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){

verificarContrasena();

}

});


</script>



</body>
</html>
